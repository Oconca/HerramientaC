

services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_volume:/code/staticfiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net

  db:
    image: postgres:15
    user: root
    volumes:
      - ../data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-dj_ctl_comb}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-alejudg1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dj_ctl_comb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - app_net

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/code/staticfiles:ro
    depends_on:
      - web
    restart: always
    networks:
      - app_net

volumes:
  static_volume:

networks:
  app_net:
    driver: bridge
