name: CI - Django Tests & Validation

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    name: Run Unit Tests & Export Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: dj_ctl_comb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password_segura
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración de Django
        env:
          DJANGO_DEBUG: "0"
          SECRET_KEY: "ci-secret-key-para-pruebas-automatizadas-en-github-actions"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "dj_ctl_comb"
          DB_USER: "postgres"
          DB_PASSWORD: "password_segura"
        run: |
          python manage.py check

      - name: Probar recolección de archivos estáticos (WhiteNoise)
        env:
          DJANGO_DEBUG: "0"
          SECRET_KEY: "ci-secret-key-para-pruebas-automatizadas-en-github-actions"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "dj_ctl_comb"
          DB_USER: "postgres"
          DB_PASSWORD: "password_segura"
        run: |
          python manage.py collectstatic --noinput

      - name: Ejecutar suite de pruebas unitarias y validación
        env:
          DJANGO_DEBUG: "1"
          SECRET_KEY: "ci-secret-key-para-pruebas-automatizadas-en-github-actions"
          ALLOWED_HOSTS: "*"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_NAME: "dj_ctl_comb"
          DB_USER: "postgres"
          DB_PASSWORD: "password_segura"
        run: |
          python manage.py test bases
